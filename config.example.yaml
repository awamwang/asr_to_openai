# =============================================================================
# ASR → OpenAI / 闪电说 代理 — 示例配置
# =============================================================================
# 用法：复制本文件为 config.yaml，填写各平台密钥（或用环境变量覆盖）。
# 规则：服务商密钥完备 → 启用；腾讯需 secret_id+secret_key，百度需 api_key+secret_key，其余看 api_key。
# 选型与比价详见：docs/asr_models_guide.md
# =============================================================================

server:
  host: "127.0.0.1"
  port: 8004
  # 环境变量：ASR_PORT
  log_file: "asr_proxy.log"
  # 环境变量：ASR_LOG
  # debug | info | warning | error
  # info：切换链（尝试模型/成败/耗时）+ 最终选用；debug：另含候选池与逐步细节
  log_level: "info"
  # 环境变量：ASR_LOG_LEVEL
  # 按天滚动，最多保留天数（历史：asr_proxy.log.YYYY-MM-DD）
  log_backup_days: 7
  # 环境变量：ASR_LOG_BACKUP_DAYS

ffmpeg_path: "ffmpeg"
# 环境变量：FFMPEG_PATH（阿里云 / 豆包识别前会转 16kHz 单声道 PCM）

# -----------------------------------------------------------------------------
# 路由说明（请求 model 字段，不是靠下面 strategy 改写 auto）
# -----------------------------------------------------------------------------
# 兼容字段 strategy：仅作记录；环境变量 ASR_STRATEGY 可写入，但不会劫持 auto。
# 真正策略请在请求里填模型 ID：
#   auto                              服务商容灾（按 auto_order + 上次成功）
#   服务商/auto                       只在该服务商 models 列表内切换
#   服务商/模型名                     定点调用
#   strategy-cost                     费用优先（刊例价；美元按 1 USD=7 CNY 粗算）
#   strategy-speed                    速度优先（静态 S1→S5）
#   strategy-accuracy                 准确度优先（静态等级）
#   strategy-free                     免费/有额度候选，按 free_order（未配则用 auto_order）
#   strategy-free+speed               免费集合内再按速度（候选受 free_order 约束）
#   strategy-free+accuracy            免费集合内再按准确度
strategy: auto

# auto：服务商之间容灾；出错试下一个。成功后下次优先从该服务商开始。
auto_order:
  - aliyun
  - doubao
  - siliconflow
  - groq
  - stepfun
  - tencent
  - baidu

# 各 strategy-* 专用服务商顺序（可选）。
# 未配置或空列表 = 不限制；非空 = 白名单（未列入则该策略不使用）。
# free 无自身排序，free_order 即为其默认顺序；cost/speed/accuracy 作过滤与同分底序。
# free+speed / free+accuracy 使用 free_order。
free_order:
  - tencent
  - aliyun
  - baidu
  - doubao
  - siliconflow
  - groq
# cost_order: []
# speed_order: []
# accuracy_order: []

# 容灾与延迟（auto / strategy-free*；显式定点不受限）
routing:
  max_failover_candidates: 4      # 最多尝试几个候选；0=不限制
  failover_cooldown_sec: 300      # 硬失败（quota/auth 等）短时跳过秒数
  failover_soft_cooldown_sec: 60  # 软失败短时跳过秒数

# 识别前统一：16k 单声道 + 裁首尾静音（失败回退原音频）
audio:
  preprocess: true
  trim_silence: true

providers:

  # ---------------------------------------------------------------------------
  # 阿里云百炼 DashScope（现有）
  # ---------------------------------------------------------------------------
  # 控制台：https://bailian.console.aliyun.com/
  # 定价：  https://help.aliyun.com/zh/model-studio/model-pricing
  # 3.1 流式模型页：
  #   https://help.aliyun.com/zh/model-studio/qwen-audio-3-1-asr-flash-streaming
  # 开通：阿里云账号 + 实名 → 开通百炼 → 建 API Key
  # 鉴权：Authorization: Bearer <DASHSCOPE_API_KEY>
  # 免费：ASR 多为 36000 秒(10h)/开通后 90 天；另有新用户试用金（以控制台为准）
  # 计费：qwen-audio-3.1-asr-flash-streaming 按 Token（输入 6 / 输出 4.5 元每百万）；
  #       3.0 flash 等仍有按秒刊例。策略侧按文档折算元/秒比价。
  # 环境变量：DASHSCOPE_API_KEY / ALIYUN_API_KEY
  #           DASHSCOPE_WORKSPACE_ID / ALIYUN_WORKSPACE_ID
  #           DASHSCOPE_ASR_MODELS / ALIYUN_ASR_MODELS（逗号分隔）
  #           DASHSCOPE_ASR_MODEL / ALIYUN_ASR_MODEL
  #           DASHSCOPE_SEMANTIC_PUNCTUATION / ALIYUN_SEMANTIC_PUNCTUATION
  #           DASHSCOPE_MAX_SENTENCE_SILENCE / ALIYUN_MAX_SENTENCE_SILENCE
  #           ALIYUN_TIMEOUT
  aliyun:
    api_key: ""
    workspace_id: ""
    # 对外 ID：aliyun/<模型名>；aliyun/auto 在此列表内切换
    models:
      - qwen-audio-3.1-asr-flash-streaming   # 当前主力；流式 WS；速度 S4
      - qwen-audio-3.0-asr-flash             # 同步/非流式；速度 S3
      - qwen3-asr-flash-realtime             # 老款实时流式
    # 流式断句（仅 streaming/realtime）。标点预测本身无法关闭。
    # False=VAD 断句（默认）；True=语义断句，少靠停顿、延迟更高
    semantic_punctuation_enabled: false
    # VAD 静音多久算一句结束（ms），范围 200–6000，官方默认 1300。
    # 调大可减少极短停顿被切成逗号/句号
    max_sentence_silence: 2500

  # ---------------------------------------------------------------------------
  # 火山引擎·豆包（现有）
  # ---------------------------------------------------------------------------
  # 产品页：https://www.volcengine.com/product/asr
  # 控制台：https://console.volcengine.com/speech
  # 模型列表：https://docs.volcengine.com/docs/6561/2499930
  # 接口说明：https://docs.volcengine.com/docs/6561/1354869
  # 计费说明：https://docs.volcengine.com/docs/DoubaoVoice/Billinginstructions-21?lang=zh
  # 开通：火山账号 + 实名 → 开通语音识别 → 取 api_key（旧版再加 app_id）
  # 鉴权：新版仅 api_key（X-Api-Key）；旧版 app_id + access_token
  # 免费：流式 / 录音文件各约 20 小时（一次性，以控制台为准）
  # 计费：流式识别 2.0 约 4.5 元/时（毫秒级计量）；本代理走 bigmodel_nostream
  # 环境变量：DOUBAO_API_KEY / VOLC_API_KEY / VOLC_ACCESS_KEY / VOLCENGINE_API_KEY
  #           DOUBAO_APP_ID / VOLC_APP_ID / VOLC_APP_KEY / VOLCENGINE_APP_ID
  #           DOUBAO_WS_URL / VOLC_WS_URL / DOUBAO_BASE_URL
  #           DOUBAO_ASR_MODELS / VOLC_ASR_MODELS
  #           DOUBAO_TIMEOUT / VOLC_TIMEOUT
  doubao:
    api_key: ""
    app_id: ""
    # 默认非流式返回的 WebSocket（准确率更高）
    base_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream"
    timeout: 90
    # 对外 ID：doubao/asr-2.0、doubao/asr-1.0；doubao/auto 在列表内切换
    # asr-2.0 → volc.seedasr.sauc.duration（SeedASR 2.0）
    # asr-1.0 → volc.bigasr.sauc.duration
    # 也可直接填资源 ID，如 volc.seedasr.sauc.concurrent
    models:
      - asr-2.0
      - asr-1.0

  # ---------------------------------------------------------------------------
  # 硅基流动 SiliconFlow（现有）
  # ---------------------------------------------------------------------------
  # 定价：  https://siliconflow.cn/pricing
  # 密钥：  https://cloud.siliconflow.cn/account/ak
  # 接口：  https://docs.siliconflow.cn/cn/api-reference/audio/create-audio-transcriptions
  # 开通：注册 + 实名 → 建 API Key（国内直连，一般无需代理）
  # 鉴权：Authorization: Bearer <SILICONFLOW_API_KEY>
  # 免费：FunAudioLLM/SenseVoiceSmall、TeleAI/TeleSpeechASR 长期免费
  # 说明：无刊例价，只进 strategy-free（及组合），不进 strategy-cost
  #       「建议 ≤5min」不是硬限，策略不会因此排除
  # 环境变量：SILICONFLOW_API_KEY / SF_API_KEY
  #           SILICONFLOW_BASE_URL / SF_BASE_URL
  #           SILICONFLOW_PROXY / SF_PROXY
  #           SILICONFLOW_ASR_MODELS / SF_ASR_MODELS
  #           SILICONFLOW_TIMEOUT / SF_TIMEOUT
  siliconflow:
    api_key: ""
    base_url: "https://api.siliconflow.cn/v1"
    proxy: ""
    timeout: 120
    # 对外 ID：siliconflow/SenseVoiceSmall（短名会映射到 FunAudioLLM/SenseVoiceSmall）
    models:
      - SenseVoiceSmall

  # ---------------------------------------------------------------------------
  # Groq（现有，海外）
  # ---------------------------------------------------------------------------
  # 定价：  https://groq.com/pricing
  # 控制台：https://console.groq.com
  # 开通：注册 Groq → API Key；国内访问通常需要 HTTP/SOCKS 代理
  # 鉴权：Authorization: Bearer <GROQ_API_KEY>（OpenAI 兼容 /audio/transcriptions）
  # 免费：Free 层约 2000 次/日、7200 秒/时、28800 秒/日（以控制台为准）
  # 硬限：单次文件 ≤25MB（策略会排除超限候选）
  # 计费：whisper-large-v3 $0.111/时，turbo $0.04/时；最短按 10s 计费（非硬拒）
  #       strategy-cost 按固定汇率 1 USD = 7 CNY 粗算后再与人民币刊例比价
  # 环境变量：GROQ_API_KEY（兼容 XAI_API_KEY / GROK_API_KEY）
  #           GROQ_BASE_URL / GROK_BASE_URL / XAI_BASE_URL
  #           GROQ_PROXY / GROK_PROXY
  #           GROQ_ASR_MODELS / GROQ_DEFAULT_MODEL
  #           GROQ_TIMEOUT / GROK_TIMEOUT
  groq:
    api_key: ""
    base_url: "https://api.groq.com/openai/v1"
    # 例：http://127.0.0.1:7881 或 socks5h://127.0.0.1:1080
    # （socks5:// 本地解析 DNS 常 TLS 失败，请用 socks5h://）
    proxy: ""
    timeout: 300
    # 对外 ID：groq/<模型名>；groq/auto 在此列表内切换
    models:
      - whisper-large-v3
      - whisper-large-v3-turbo

  # ---------------------------------------------------------------------------
  # 阶跃 / 腾讯极速版 / 百度（已接入；密钥完备即参与路由）
  # ---------------------------------------------------------------------------

  # 阶跃星辰 StepFun — 性价比主力
  # 开放平台：https://platform.stepfun.com/
  # 定价：    https://platform.stepfun.com/docs/zh/guides/pricing/details
  # 接口：POST /v1/audio/transcriptions（OpenAI 风格），Bearer 单一密钥
  # 计费：stepaudio-2.5-asr 0.15 元/时；流式 stepaudio-2.5-asr-stream 1.2 元/时
  # 无长期免费，不进 strategy-free；刊例最低，常为 strategy-cost 首选
  # stepfun:
  #   api_key: ""
  #   base_url: "https://api.stepfun.com/v1"
  #   models:
  #     - stepaudio-2.5-asr

  # 腾讯云 ASR — 录音文件识别极速版（同步 Flash，本地上传）
  # 产品：https://cloud.tencent.com/product/asr
  # 极速版 API：https://cloud.tencent.com/document/product/1093/52097
  # CAM 密钥：https://console.cloud.tencent.com/cam/capi
  # 鉴权：Flash HMAC-SHA1（SecretId / SecretKey / AppID）
  # 硬限：极速版 → t>2h 或文件>100MB 会被策略排除
  # 免费：标准 Flash 引擎共用「录音文件识别极速版」每月 5h（不是每个引擎各 5h）
  #       realtime-* 共用「实时语音识别」每月 5h（与 Flash 包不共用）
  # 无月免费：16k_zh_en / 16k_multi_lang / 8k_zh_large（大模型1.0，需单独资源包或后付费）
  # 未接入：录音文件·大模型 2.0（需公网 URL）
  # tencent:
  #   secret_id: ""
  #   secret_key: ""
  #   app_id: ""
  #   models:
  #     - 16k_zh              # Flash 中文通用（推荐默认，S1）
  #     - realtime-16k_zh     # 实时 WebSocket（另计实时 5h，约 1:1）
  #     - "16k_zh-PY"         # Flash 中英粤
  #     - 16k_en              # Flash 英语
  #     - 16k_yue             # Flash 粤语
  #     - 8k_zh               # Flash 中文电话
  #     - 8k_en               # Flash 英文电话
  #     # 同包其他标准 Flash：16k_ja / 16k_ko / 16k_vi / …
  #     # - 16k_zh_en         # Flash 大模型1.0，无月免费额度
  #   max_sentence_silence: 2500   # 本地合并碎句（Flash 无 VAD 参数）
  #   filter_punc: 2               # 0不过滤 / 1句末 / 2全部（闪电说建议 2）

  # 百度智能云 短语音
  # 首页：https://cloud.baidu.com/product/speech.html
  # 控制台：https://console.bce.baidu.com/ai-engine/speech/overview/index
  # 短语音文档：https://cloud.baidu.com/doc/SPEECH/s/Jlbxdezuf
  # 鉴权：AppID / API Key / Secret Key → OAuth access_token（约 30 天）
  # 硬限：单次 ≤60 秒；超限会被 strategy-* 排除
  # 注意：80001 须在控制台开通极速版权限，否则识别失败并 failover
  # baidu:
  #   app_id: ""
  #   api_key: ""
  #   secret_key: ""
  #   models:
  #     - "1537"    # 短语音标准版
  #     - "80001"   # 短语音极速版
