# 复制为 config.yaml 后填写。也可通过环境变量覆盖（见各字段注释）。
# 规则：某服务商的 api_key 非空 → 启用该服务商。

server:
  host: "127.0.0.1"
  port: 8004
  # 可用环境变量 ASR_PORT 覆盖
  log_file: "asr_proxy.log"
  # 可用环境变量 ASR_LOG 覆盖

ffmpeg_path: "ffmpeg"
# 可用环境变量 FFMPEG_PATH 覆盖

# auto：只在服务商之间切换；出错则试下一个。成功后下次优先从该服务商开始。
auto_order:
  - aliyun
  - groq
  - doubao

providers:
  aliyun:
    # 环境变量：DASHSCOPE_API_KEY / ALIYUN_API_KEY
    api_key: ""
    # 环境变量：DASHSCOPE_WORKSPACE_ID / ALIYUN_WORKSPACE_ID
    workspace_id: ""
    # 多模型列表。对外 ID：aliyun/<模型名>；aliyun/auto 在此列表内切换。
    # 环境变量：DASHSCOPE_ASR_MODELS / ALIYUN_ASR_MODELS（逗号分隔）
    # 或单模型：DASHSCOPE_ASR_MODEL / ALIYUN_ASR_MODEL
    models:
      - qwen-audio-3.1-asr-flash-streaming
      - qwen-audio-3.0-asr-flash
      - qwen3-asr-flash-realtime

  groq:
    # Groq Whisper（OpenAI 兼容）。环境变量：GROQ_API_KEY
    api_key: ""
    # 环境变量：GROQ_BASE_URL
    base_url: "https://api.groq.com/openai/v1"
    # 访问 Groq 常需代理。环境变量：GROQ_PROXY
    # 例：http://127.0.0.1:7881 或 socks5h://127.0.0.1:1080
    proxy: ""
    # 环境变量：GROQ_TIMEOUT（秒）
    timeout: 300
    # 多模型列表。对外 ID：groq/<模型名>；groq/auto 在此列表内切换。
    # 环境变量：GROQ_ASR_MODELS（逗号分隔）或 GROQ_DEFAULT_MODEL
    models:
      - whisper-large-v3
      - whisper-large-v3-turbo

  doubao:
    # 豆包流式语音识别 1.0 / 2.0（火山 openspeech WebSocket）
    # 文档：https://docs.volcengine.com/docs/6561/1354869
    # 新版控制台：只填 api_key（X-Api-Key）
    # 旧版控制台：填 app_id + api_key（Access Token）
    # 环境变量：DOUBAO_API_KEY / VOLC_API_KEY / VOLC_ACCESS_KEY
    api_key: ""
    # 环境变量：DOUBAO_APP_ID / VOLC_APP_ID / VOLC_APP_KEY
    app_id: ""
    # 默认流式输入模式（准确率更高）。环境变量：DOUBAO_WS_URL
    base_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream"
    # 环境变量：DOUBAO_TIMEOUT（秒）
    timeout: 90
    # 对外 ID：doubao/asr-2.0、doubao/asr-1.0；doubao/auto 在列表内切换
    # asr-1.0 → volc.bigasr.sauc.duration
    # asr-2.0 → volc.seedasr.sauc.duration
    # 也可直接填资源 ID，如 volc.seedasr.sauc.concurrent
    # 环境变量：DOUBAO_ASR_MODELS（逗号分隔）
    models:
      - asr-2.0
      - asr-1.0
